name: Distribution boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Enforce public allowlist and history hygiene
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected <<'EOF'
          .gitattributes
          .github/workflows/distribution-policy.yml
          .gitignore
          DISTRIBUTION-POLICY.md
          LICENSE
          README.md
          SECURITY.md
          install.sh
          release-public.pem
          EOF
          git ls-files | LC_ALL=C sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          test "$(git ls-files --stage -- install.sh | awk '{print $1}')" = 100755
          grep -Fq -- '-----BEGIN PUBLIC KEY-----' release-public.pem
          ! grep -Fq 'PRIVATE KEY' release-public.pem
          private_key='PRIVATE'' KEY'
          github_token='github_''pat_'
          pattern="BEGIN ([A-Z0-9 ]+ )?${private_key}|${github_token}|gh[pousr]_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16}|xox[baprs]-"
          while read -r commit; do
            if git grep -I -q -E "$pattern" "$commit" -- . ':(exclude).github/workflows/distribution-policy.yml'; then
              echo "Material sensível detectado no histórico." >&2
              exit 1
            fi
            if git show "$commit:.github/workflows/distribution-policy.yml" >/tmp/workflow-at-commit 2>/dev/null; then
              grep -Ev '^\s*(private_key|github_token|pattern)=|^\s*if git grep ' /tmp/workflow-at-commit > /tmp/workflow-without-scanner || true
              if grep -I -q -E "$pattern" /tmp/workflow-without-scanner; then
                echo "Material sensível detectado no histórico do workflow." >&2
                exit 1
              fi
            fi
          done < <(git rev-list --all)
